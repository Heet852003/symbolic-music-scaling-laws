model:
  d_model: 512
  n_heads: 8
  n_layers: 6
  d_ff: 2048
  max_seq_len: 1024
  dropout: 0.1
  tie_weights: false

training:
  block_size: 1024
  batch_size: 64
  num_epochs: 1
  learning_rate: 3e-4
  weight_decay: 0.1
  optimizer: adamw
  scheduler: cosine
  warmup_steps: 1000
  grad_clip: 1.0
  eval_interval: 1000

